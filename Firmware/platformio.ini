
; ============================================================
; VENTIQ - Smart Rack Cooling
; Firmware: VENTIQ Core RevA
; Controller: Wemos D1 mini / ESP8266
; Framework: Arduino
; Build system: PlatformIO
; ============================================================

[platformio]
default_envs = ventiq_core_reva
src_dir = src
include_dir = include
data_dir = data
test_dir = test


; ============================================================
; VENTIQ CORE REVA
; ============================================================

[env:ventiq_core_reva]

; Platform / Controller
platform = espressif8266
board = d1_mini
framework = arduino

; CPU
board_build.f_cpu = 80000000L

; Flash / Filesystem
; Voraussetzung: Wemos D1 mini mit 4 MB Flash
; 1 MB LittleFS, restlicher Bereich für Firmware/OTA
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs

; Serial Monitor
monitor_speed = 115200
monitor_filters =
    esp8266_exception_decoder
    time

; USB Upload
upload_protocol = esptool
upload_speed = 460800

; Firmware-Definitionen
build_flags =
    -D VENTIQ_CORE_REVA
    -D VENTIQ_ENABLE_OTA=1
    -D VENTIQ_ENABLE_WEB=1
    -D VENTIQ_ENABLE_MQTT=1

; Bibliotheken
; Weitere Abhaengigkeiten werden von den
; jeweiligen Feature-Agenten ergaenzt.
lib_deps =
    adafruit/Adafruit EMC2101@^1.0.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.5
    bblanchon/ArduinoJson@^7.4.0
    knolleary/PubSubClient@^2.8

; Entwicklungsoptionen
lib_ldf_mode = chain+
lib_compat_mode = strict

; ============================================================
; Host-Tests (Unity): pio test -e native
; Benoetigt einen lokalen gcc/g++ (z. B. MinGW-w64).
; ============================================================

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<update/UpdateManager.cpp> +<config/ConfigValidator.cpp>
build_flags =
    -std=gnu++17
    -I include
    -I src/update
lib_deps =
